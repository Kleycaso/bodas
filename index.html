<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organizador de Boda</title>
<style>
:root{--bg:#0e0c0b;--card:rgba(32,27,24,.82);--tx:#f6efe6;--mu:#b3a595;--ac:#d4af6a;--ac2:#f1d9a0;--bd:rgba(212,175,106,.28);--ok:#7fc79a;--no:#e07a72;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"Cormorant Garamond",Georgia,serif;font-size:17px;line-height:1.4;background:radial-gradient(ellipse at 15% 0%,rgba(212,175,106,.22),transparent 45%),radial-gradient(ellipse at 90% 30%,rgba(150,70,90,.18),transparent 45%),radial-gradient(ellipse at 20% 100%,rgba(212,175,106,.14),transparent 50%),linear-gradient(160deg,#17120f,#0b0908 70%);background-color:#0e0c0b;background-attachment:fixed}
.w{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.logo{display:block;margin:4px auto 6px;width:130px;height:130px;border-radius:50%;box-shadow:0 0 0 2px rgba(212,175,106,.5),0 0 40px rgba(212,175,106,.35)}
h1{font-family:"Great Vibes","Brush Script MT",cursive;font-weight:400;margin:6px 0 0;font-size:44px;text-align:center;color:var(--ac2);text-shadow:0 2px 14px rgba(212,175,106,.35)}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--ac);margin:2px 0 6px;font-size:15px}
.orn:before,.orn:after{content:"";height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--ac))}
.orn:after{transform:scaleX(-1)}
.sub{text-align:center;color:var(--ac2);font-size:19px;font-style:italic;margin:0 0 4px}
.st{text-align:center;font-size:13px;color:var(--mu);margin-bottom:12px;font-family:system-ui,sans-serif}
.top{display:flex;gap:8px;margin-bottom:14px}
input,select{font:inherit;font-size:16px;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0;outline:none}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(212,175,106,.18)}
select option{background:#1d1815;color:var(--tx)}
::placeholder{color:#8d8073}
input[type=date]{color-scheme:dark}
.top input{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:14px;padding:5px;border:1px solid var(--bd);border-radius:999px;background:rgba(0,0,0,.35)}
.tabs button{flex:1;padding:10px 4px;border:0;background:transparent;color:var(--mu);border-radius:999px;font:inherit;font-size:16px;cursor:pointer;transition:.2s}
.tabs button.on{background:linear-gradient(135deg,#f1d9a0,#c79a4a);color:#2a1d0a;font-weight:700;box-shadow:0 4px 14px rgba(212,175,106,.35)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px;backdrop-filter:blur(6px)}
.sum{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sum div{flex:1;min-width:95px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center}
.sum b{display:block;font-size:26px;color:var(--ac2);font-weight:600}
.sum span{font-size:13px;color:var(--mu)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.add input{flex:1;min-width:110px}
.btn{background:linear-gradient(135deg,#f1d9a0,#c79a4a);color:#2a1d0a;border:0;border-radius:999px;padding:10px 20px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(212,175,106,.3);transition:.15s}
.btn:active{transform:scale(.96)}
.x{background:rgba(224,122,114,.12);border:1px solid rgba(224,122,114,.4);color:var(--no);width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;padding:0;flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .n{flex:1;min-width:120px;font-weight:600;font-size:19px}
.row input[type=number]{width:95px}
.mu{color:var(--mu);font-size:14px}
.done{text-decoration:line-through;color:var(--mu)}
.tag{font-size:12px;color:var(--ac2);border:1px solid var(--bd);border-radius:999px;padding:2px 10px;font-family:system-ui,sans-serif;white-space:nowrap}
details{margin-bottom:10px}
summary{cursor:pointer;font-weight:600;font-size:19px;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;list-style:none}
summary::-webkit-details-marker{display:none}
summary span{float:right;color:var(--ac2);font-weight:400;font-size:15px}
.it{display:flex;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid rgba(212,175,106,.12)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--ac);border-radius:50%;padding:0;background:transparent;flex:none;cursor:pointer;display:grid;place-content:center}
input[type=checkbox]:checked{background:linear-gradient(135deg,#f1d9a0,#c79a4a)}
input[type=checkbox]:checked:after{content:"✓";color:#2a1d0a;font-weight:900;font-size:15px;line-height:1}
.it label{flex:1;cursor:pointer}
.foot{text-align:center;color:var(--mu);font-size:13px;margin-top:22px;font-style:italic}
</style>

];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
var SEED="12 meses antes|Fijar fecha y presupuesto total;12 meses antes|Reservar finca o salón;12 meses antes|Elegir wedding planner o coordinador;9 meses antes|Contratar fotógrafo y vídeo;9 meses antes|Reservar catering y hacer prueba de menú;9 meses antes|Contratar música (DJ, orquesta, pianista);6 meses antes|Enviar save the date;6 meses antes|Elegir vestido y traje;6 meses antes|Reservar alojamiento y transporte de invitados;4 meses antes|Encargar invitaciones;4 meses antes|Contratar flores y decoración;4 meses antes|Contratar animación infantil (castillo hinchable);2 meses antes|Enviar invitaciones;2 meses antes|Prueba de peluquería y maquillaje;2 meses antes|Papeleo civil o religioso;1 mes antes|Cerrar lista final de invitados;1 mes antes|Confirmar seating plan y mesas;1 mes antes|Ensayo de la ceremonia;1 semana antes|Confirmar horarios con todos los proveedores;1 semana antes|Pagos finales y propinas;1 semana antes|Preparar kit de emergencia;Día D|Entregar anillos y detalles al coordinador;Día D|¡Disfrutar de la boda! 💍".split(";");
function seed(){if(D.seeded||D.tasks.length)return false;SEED.forEach(function(x){var a=x.split("|");D.tasks.push({id:uid(),w:a[0],n:a[1],f:"",d:false})});D.seeded=true;return true}
function norm(o){o=o||{};return{name:o.name||"",date:o.date||"",guests:o.guests||[],budget:o.budget||[],tasks:o.tasks||[],checks:o.checks||{},custom:o.custom||[],seeded:!!o.seeded}}
function loadLocal(){try{var s=localStorage.getItem(KEY);if(s)D=norm(JSON.parse(s))}catch(e){}}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
}
function chg(f){f();save();draw()}
function head(){
  $("ttl").textContent=D.name||"Nuestra Boda";
  if(document.activeElement!==$("nm"))$("nm").value=D.name;
  if(document.activeElement!==$("dt"))$("dt").value=D.date;
  var c="";
  if(D.date){var d=Math.ceil((new Date(D.date+"T00:00")-new Date())/864e5);c=d>0?"Faltan "+d+" días":d==0?"¡Es hoy! 💍":"Boda celebrada"}
  $("cd").textContent=c;

  var T=[["g","Invitados"],["b","Presupuesto"],["t","Tareas"],["c","Servicios"]];
  $("tabs").innerHTML=T.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");
}
function draw(){head();
  var h="",i;
  if(tab=="g"){
    var ok=0,no=0,pe=0,pers=0;

    h+='<div class="add"><input id="gn" placeholder="Nombre del invitado"><input id="gp" type="number" min="0" placeholder="Acomp." style="max-width:80px"><button class="btn" id="ga">Añadir</button></div>';

      its.forEach(function(n,k){h+='<div class="it"><input type="checkbox" id="c'+ci+'_'+k+'" data-ck="'+esc(n)+'"'+(D.checks[n]?" checked":"")+'><label for="c'+ci+'_'+k+'" class="'+(D.checks[n]?"":"mu")+'">'+esc(n)+'</label></div>'});
      h+='</details>'});
    h+='<details data-oc="99"'+(OP[99]?" open":"")+'><summary>✨ Otros (añade lo tuyo)<span>'+D.custom.filter(function(x){return D.checks[x.n]}).length+'/'+D.custom.length+'</span></summary><div class="add" style="margin-top:8px"><input id="cn" placeholder="Ej: tren de la bruja, puesto de crepes…"><button class="btn" id="ca">Añadir</button></div>';
    D.custom.forEach(function(x,k){h+='<div class="it"><input type="checkbox" id="cx'+k+'" data-ck="'+esc(x.n)+'"'+(D.checks[x.n]?" checked":"")+'><label for="cx'+k+'">'+esc(x.n)+'</label><button class="x" data-cd="'+k+'">✕</button></div>'});
    h+='</details>';
  }
  $("v").innerHTML=h;
}

function resumen(){
  var L=[];
  L.push("💍 *"+(D.name||"Mi boda")+"*"+(D.date?" · "+D.date:""));
  var pers=0;D.guests.forEach(function(g){if(g.st=="si")pers+=1+(+g.plus||0)});
  if(D.guests.length){L.push("","👥 *Invitados* ("+D.guests.length+" invitaciones, "+pers+" personas confirmadas)");
    D.guests.forEach(function(g){L.push("• "+g.n+(g.plus?" +"+g.plus:"")+" – "+(g.st=="si"?"viene":g.st=="no"?"no viene":"pendiente")+(g.note?" ("+g.note+")":""))})}
  var any=false;
  CAT.forEach(function(c){var m=c[1].split("|").filter(function(n){return D.checks[n]});
    if(c===CAT[CAT.length-1]&&!m.length&&!D.custom.length)return;
    if(m.length){if(!any){L.push("","✨ *Servicios que quiero*");any=true}L.push(c[0]+": "+m.join(", "))}});
  if(D.custom.length){if(!any)L.push("","✨ *Servicios que quiero*");L.push("✨ Otros: "+D.custom.map(function(x){return x.n}).join(", "))}
  if(D.budget.length){var tp=0,tg=0;L.push("","💶 *Presupuesto*");D.budget.forEach(function(b){tp+=+b.p||0;tg+=+b.g||0;L.push("• "+b.n+": "+(+b.p||0)+" € (pagado "+(+b.g||0)+" €)")});L.push("Total previsto "+tp+" € · pagado "+tg+" €")}
  var pend=D.tasks.filter(function(t){return !t.d});
  if(D.tasks.length)L.push("","✅ Tareas hechas: "+(D.tasks.length-pend.length)+" de "+D.tasks.length);
  return L.join("\n");
}
document.addEventListener("click",function(e){
  var t=e.target,d=t.dataset||{};
  if(d.t){tab=d.t;draw();return}
  if(t.id=="wa"){var url="https://wa.me/"+TEL+"?text="+encodeURIComponent(resumen());window.open(url,"_blank")||(location.href=url);return}
  if(t.id=="rs"){if(confirm("¿Seguro que quieres borrar todo? No se puede deshacer.")){try{localStorage.removeItem(KEY)}catch(x){}D=norm({});seed();save();draw()}return}
  if(t.id=="ga"){var n=$("gn").value.trim();if(n)chg(function(){D.guests.push({n:n,plus:+$("gp").value||0,st:"pe",note:""})});return}
  if(t.id=="ba"){var n2=$("bn").value.trim();if(n2)chg(function(){D.budget.push({n:n2,p:+$("bp").value||0,g:0,note:""})});return}
  if(t.id=="ta"){var n3=$("tn").value.trim();if(n3)chg(function(){D.tasks.push({id:uid(),n:n3,f:$("td").value,d:false})});return}
  if(t.id=="ca"){var n4=$("cn").value.trim();if(n4)chg(function(){D.custom.push({n:n4});D.checks[n4]=true});return}
  if(d.cd!=null&&confirm("¿Borrar?"))chg(function(){var x=D.custom.splice(+d.cd,1)[0];delete D.checks[x.n]});
  if(d.gd!=null&&confirm("¿Borrar invitado?"))chg(function(){D.guests.splice(+d.gd,1)});
  if(d.bd!=null&&confirm("¿Borrar gasto?"))chg(function(){D.budget.splice(+d.bd,1)});
  if(d.td!=null&&confirm("¿Borrar tarea?"))chg(function(){D.tasks=D.tasks.filter(function(x){return x.id!=d.td})});
});
document.addEventListener("change",function(e){
  var t=e.target,d=t.dataset||{};
  if(d.ck!=null){if(t.checked)D.checks[d.ck]=true;else delete D.checks[d.ck];save();draw();return}
  if(d.gs!=null)chg(function(){D.guests[+d.gs].st=t.value});
  if(d.gpl!=null)chg(function(){D.guests[+d.gpl].plus=+t.value||0});
  if(d.gno!=null){D.guests[+d.gno].note=t.value;save()}
  if(d.bp!=null)chg(function(){D.budget[+d.bp].p=+t.value||0});
  if(d.bg!=null)chg(function(){D.budget[+d.bg].g=+t.value||0});
  if(d.bno!=null){D.budget[+d.bno].note=t.value;save()}
  if(d.tc!=null)chg(function(){D.tasks.forEach(function(x){if(x.id==d.tc)x.d=t.checked})});
});
document.addEventListener("toggle",function(e){var o=e.target.dataset&&e.target.dataset.oc;if(o!=null)OP[o]=e.target.open},true);
$("nm").addEventListener("input",function(){D.name=this.value;save();$("ttl").textContent=D.name||"Nuestra Boda"});
$("dt").addEventListener("change",function(){D.date=this.value;save();head()});
loadLocal();if(seed())save();draw();
</script></body></html>
