.w{position:relative}
.w{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.logo{display:block;margin:4px auto 6px;width:130px;height:130px;border-radius:50%;box-shadow:0 0 0 2px rgba(212,175,106,.5),0 0 40px rgba(212,175,106,.35)}
h1{font-family:"Great Vibes","Brush Script MT",cursive;font-weight:400;margin:6px 0 0;font-size:44px;text-align:center;color:var(--ac2);text-shadow:0 2px 14px rgba(212,175,106,.35)}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--ac);margin:2px 0 6px;font-size:15px}
.orn:before,.orn:after{content:"";height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--ac))}
.orn:after{transform:scaleX(-1)}
.sub{text-align:center;color:var(--ac2);font-size:19px;font-style:italic;margin:0 0 4px}
.st{text-align:center;font-size:13px;color:var(--mu);margin-bottom:12px;font-family:system-ui,sans-serif}
.top{display:flex;gap:8px;margin-bottom:14px}
input,select{font:inherit;font-size:16px;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0;outline:none}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(212,175,106,.18)}
select option{background:#1d1815;color:var(--tx)}
::placeholder{color:#8d8073}
input[type=date]{color-scheme:dark}
.top input{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:14px;padding:5px;border:1px solid var(--bd);border-radius:999px;background:rgba(0,0,0,.35)}
.tabs button{flex:1;padding:10px 4px;border:0;background:transparent;color:var(--mu);border-radius:999px;font:inherit;font-size:16px;cursor:pointer;transition:.2s}
.tabs button.on{background:linear-gradient(135deg,#f1d9a0,#c79a4a);color:#2a1d0a;font-weight:700;box-shadow:0 4px 14px rgba(212,175,106,.35)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px;backdrop-filter:blur(6px)}
.sum{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sum div{flex:1;min-width:95px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center}
.sum b{display:block;font-size:26px;color:var(--ac2);font-weight:600}
.sum span{font-size:13px;color:var(--mu)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.add input{flex:1;min-width:110px}
.btn{background:linear-gradient(135deg,#f1d9a0,#c79a4a);color:#2a1d0a;border:0;border-radius:999px;padding:10px 20px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(212,175,106,.3);transition:.15s}
.btn:active{transform:scale(.96)}
.x{background:rgba(224,122,114,.12);border:1px solid rgba(224,122,114,.4);color:var(--no);width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;padding:0;flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .n{flex:1;min-width:120px;font-weight:600;font-size:19px}
.row input[type=number]{width:95px}
.mu{color:var(--mu);font-size:14px}
.done{text-decoration:line-through;color:var(--mu)}
.tag{font-size:12px;color:var(--ac2);border:1px solid var(--bd);border-radius:999px;padding:2px 10px;font-family:system-ui,sans-serif;white-space:nowrap}
details{margin-bottom:10px}
summary{cursor:pointer;font-weight:600;font-size:19px;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;list-style:none}
summary::-webkit-details-marker{display:none}
summary span{float:right;color:var(--ac2);font-weight:400;font-size:15px}
.it{display:flex;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid rgba(212,175,106,.12)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--ac);border-radius:50%;padding:0;background:transparent;flex:none;cursor:pointer;display:grid;place-content:center}
input[type=checkbox]:checked{background:linear-gradient(135deg,#f1d9a0,#c79a4a)}
input[type=checkbox]:checked:after{content:"✓";color:#2a1d0a;font-weight:900;font-size:15px;line-height:1}
.it label{flex:1;cursor:pointer}
.foot{text-align:center;color:var(--mu);font-size:13px;margin-top:22px;font-style:italic}
</style>

["🚗 Transporte y alojamiento","Coche de los novios|Coche clásico|Carruaje o caballos|Autobús para invitados|Alojamiento de invitados|Suite nupcial|Parking o aparcacoches|Taxis de vuelta"],
["💌 Papelería y detalles","Save the date|Invitaciones|Web de la boda|Detalles para invitados|Detalles para madres|Regalo para padrinos|Bolsas de bienvenida|Chanclas para bailar|Tarjetas de agradecimiento|Lista de bodas"],
["📋 Organización","Wedding planner|Coordinador del día B|Contratos con proveedores|Seguro de boda|Papeleo civil o religioso|Permisos del local|Ensayo de la ceremonia|Plan B por si llueve|Luna de miel|Propinas y pagos del día"]
];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
var SEED="12 meses antes|Fijar fecha y presupuesto total;12 meses antes|Reservar finca o salón;12 meses antes|Elegir wedding planner o coordinador;9 meses antes|Contratar fotógrafo y vídeo;9 meses antes|Reservar catering y hacer prueba de menú;9 meses antes|Contratar música (DJ, orquesta, pianista);6 meses antes|Enviar save the date;6 meses antes|Elegir vestido y traje;6 meses antes|Reservar alojamiento y transporte de invitados;4 meses antes|Encargar invitaciones;4 meses antes|Contratar flores y decoración;4 meses antes|Contratar animación infantil (castillo hinchable);2 meses antes|Enviar invitaciones;2 meses antes|Prueba de peluquería y maquillaje;2 meses antes|Papeleo civil o religioso;1 mes antes|Cerrar lista final de invitados;1 mes antes|Confirmar seating plan y mesas;1 mes antes|Ensayo de la ceremonia;1 semana antes|Confirmar horarios con todos los proveedores;1 semana antes|Pagos finales y propinas;1 semana antes|Preparar kit de emergencia;Día D|Entregar anillos y detalles al coordinador;Día D|¡Disfrutar de la boda! 💍".split(";");
function seed(){return false;SEED.forEach(function(x){var a=x.split("|");D.tasks.push({id:uid(),w:a[0],n:a[1],f:"",d:false})});D.seeded=true;return true}
function norm(o){o=o||{};return{id:o.id||uid(),name:o.name||"",date:o.date||"",guests:o.guests||[],budget:o.budget||[],tasks:o.tasks||[],checks:o.checks||{},custom:o.custom||[],seeded:!!o.seeded}}
var KEY2="cliente-v1",ALL={cur:"",list:[]};
function pick(){D=ALL.list.filter(function(x){return x.id==ALL.cur})[0]||ALL.list[0];ALL.cur=D.id}
function loadLocal(){try{var s=localStorage.getItem(KEY2);if(s){var a=JSON.parse(s);ALL.cur=a.cur;ALL.list=(a.list||[]).map(norm)}else{var o=localStorage.getItem(KEY);if(o)ALL.list=[norm(JSON.parse(o))]}}catch(e){}
  if(!ALL.list.length)ALL.list=[norm({})];pick()}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function due(t){if(t.f)return t.f;if(!D.date||!t.w)return "";var b=new Date(D.date+"T12:00:00"),m=/(\d+)\s*mes/.exec(t.w),w=/(\d+)\s*semana/.exec(t.w);if(m)b.setMonth(b.getMonth()-(+m[1]));else if(w)b.setDate(b.getDate()-7*(+w[1]));else if(!/Día D/.test(t.w))return "";return b.getFullYear()+"-"+("0"+(b.getMonth()+1)).slice(-2)+"-"+("0"+b.getDate()).slice(-2)}
function fdate(u){var a=u.split("-");return a[2]+"/"+a[1]+"/"+a[0]}
function svc(n,on){if(on){D.checks[n]=true;if(!D.budget.some(function(b){return b.svc==n}))D.budget.push({n:n,p:0,g:0,note:"",svc:n})}else{delete D.checks[n];D.budget=D.budget.filter(function(b){return !(b.svc==n&&!(+b.p)&&!(+b.g)&&!b.note)})}}
function save(){
  try{localStorage.setItem(KEY2,JSON.stringify(ALL))}catch(e){}
}
function chg(f){f();save();draw()}
function head(){
  $("ttl").textContent=D.name||"Nuestra Boda";
  if(document.activeElement!==$("nm"))$("nm").value=D.name;
  if(document.activeElement!==$("dt"))$("dt").value=D.date;
  $("sel").innerHTML=ALL.list.map(function(b){return '<option value="'+b.id+'"'+(b.id==ALL.cur?" selected":"")+'>'+esc(b.name||"Boda sin nombre")+'</option>'}).join("");
  var c="";
  if(D.date){var d=Math.ceil((new Date(D.date+"T00:00")-new Date())/864e5);c=d>0?"Faltan "+d+" días":d==0?"¡Es hoy! 💍":"Boda celebrada"}
  $("cd").textContent=c;
  $("st").textContent="💾 Todo se guarda automáticamente en este dispositivo";
  var T=[["c","Servicios"],["g","Invitados"]];
  $("tabs").innerHTML=T.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");
}
function draw(){head();
  var h="",i;
  if(tab=="g"){
    var ok=0,no=0,pe=0,pers=0;
    D.guests.forEach(function(g){var n=1+(+g.plus||0);if(g.st=="si"){ok++;pers+=n}else if(g.st=="no")no++;else pe++});
    h+='<div class="sum"><div><b>'+pers+'</b><span>personas confirmadas</span></div><div><b>'+pe+'</b><span>pendientes</span></div><div><b>'+no+'</b><span>no vienen</span></div></div>';
    h+='<div class="add"><input id="gn" placeholder="Nombre del invitado"><input id="gp" type="number" min="0" placeholder="Acomp." style="max-width:80px"><button class="btn" id="ga">Añadir</button></div>';
    D.guests.forEach(function(g,k){
      h+='<div class="card"><div class="row"><span class="n">'+esc(g.n)+'</span><select data-gs="'+k+'"><option value="pe"'+(g.st=="pe"?" selected":"")+'>⏳ Pendiente</option><option value="si"'+(g.st=="si"?" selected":"")+'>✅ Viene</option><option value="no"'+(g.st=="no"?" selected":"")+'>❌ No viene</option></select><button class="x" data-gd="'+k+'">✕</button></div>';
      h+='<div class="row" style="margin-top:6px"><span class="mu">Acompañantes</span><input type="number" min="0" style="width:70px" value="'+(+g.plus||0)+'" data-gpl="'+k+'"><input style="flex:1" placeholder="Menú, alergias, mesa…" value="'+esc(g.note)+'" data-gno="'+k+'"></div></div>'});
    if(!D.guests.length)h+='<p class="mu">Aún no hay invitados.</p>';
  }
  if(tab=="b"){
    var tp=0,tg=0;D.budget.forEach(function(b){tp+=+b.p||0;tg+=+b.g||0});
    h+='<div class="sum"><div><b>'+tp.toLocaleString("es-ES")+' €</b><span>previsto</span></div><div><b>'+tg.toLocaleString("es-ES")+' €</b><span>pagado</span></div><div><b>'+(tp-tg).toLocaleString("es-ES")+' €</b><span>pendiente</span></div></div>';
    h+='<p class="mu">🔗 Los servicios que marques en la pestaña Servicios aparecen aquí para poner su precio.</p>';
    h+='<div class="add"><input id="bn" placeholder="Concepto (catering, flores…)"><input id="bp" type="number" placeholder="Previsto €" style="max-width:110px"><button class="btn" id="ba">Añadir</button></div>';
    D.budget.forEach(function(b,k){
      h+='<div class="card"><div class="row"><span class="n">'+esc(b.n)+'</span><button class="x" data-bd="'+k+'">✕</button></div><div class="row" style="margin-top:6px"><span class="mu">Previsto</span><input type="number" value="'+(+b.p||0)+'" data-bp="'+k+'"><span class="mu">Pagado</span><input type="number" value="'+(+b.g||0)+'" data-bg="'+k+'"></div><input style="width:100%;margin-top:6px" placeholder="Proveedor / teléfono / notas" value="'+esc(b.note)+'" data-bno="'+k+'"></div>'});
    if(!D.budget.length)h+='<p class="mu">Aún no hay gastos.</p>';
  }
  if(tab=="t"){
    var today=todayStr(),dn=0,late=0;
    D.tasks.forEach(function(t){if(t.d)dn++;else{var u0=due(t);if(u0&&u0<today)late++}});
    h+='<div class="sum"><div><b>'+dn+' / '+D.tasks.length+'</b><span>tareas hechas</span></div><div><b style="color:'+(late?"var(--no)":"var(--ok)")+'">'+late+'</b><span>atrasadas</span></div></div>';
    if(!D.date)h+='<p class="mu">💡 Pon la fecha de la boda arriba y cada tarea tendrá su fecha límite automática.</p>';
    h+='<div class="add"><input id="tn" placeholder="Nueva tarea"><input id="td" type="date" style="max-width:150px"><button class="btn" id="ta">Añadir</button></div>';
    D.tasks.slice().sort(function(a,b){return (a.d-b.d)||String(due(a)||"9").localeCompare(String(due(b)||"9"))}).forEach(function(t){
      var u=due(t),lt=!t.d&&u&&u<today;
      h+='<div class="card"><div class="row"><input type="checkbox" '+(t.d?"checked":"")+' data-tc="'+t.id+'"><span class="n '+(t.d?"done":"")+'">'+esc(t.n)+'</span>'+(t.w?'<span class="tag">'+esc(t.w)+'</span>':"")+(u?'<span class="tag" style="'+(lt?"color:var(--no);border-color:var(--no)":"")+'">'+(lt?"⚠️ ":"")+fdate(u)+'</span>':"")+'<button class="x" data-td="'+t.id+'">✕</button></div></div>'});
    if(!D.tasks.length)h+='<p class="mu">Aún no hay tareas.</p>';
  }
  if(tab=="c"){
    var tot=0,mk=0;
    CAT.forEach(function(c){c[1].split("|").forEach(function(n){tot++;if(D.checks[n])mk++})});
    D.custom.forEach(function(c){tot++;if(D.checks[c.n])mk++});
    h+='<div class="sum"><div><b>'+mk+' / '+tot+'</b><span>marcados</span></div></div><p class="mu">Marca con ✓ lo que queréis incluir en la boda.</p>';
    CAT.forEach(function(c,ci){
      var its=c[1].split("|"),m=its.filter(function(n){return D.checks[n]}).length;
      h+='<details data-oc="'+ci+'"'+(OP[ci]?" open":"")+'><summary>'+c[0]+'<span>'+m+'/'+its.length+'</span></summary>';
      its.forEach(function(n,k){h+='<div class="it"><input type="checkbox" id="c'+ci+'_'+k+'" data-ck="'+esc(n)+'"'+(D.checks[n]?" checked":"")+'><label for="c'+ci+'_'+k+'" class="'+(D.checks[n]?"":"mu")+'">'+esc(n)+'</label></div>'});
      h+='</details>'});
    h+='<details data-oc="99"'+(OP[99]?" open":"")+'><summary>✨ Otros (añade lo tuyo)<span>'+D.custom.filter(function(x){return D.checks[x.n]}).length+'/'+D.custom.length+'</span></summary><div class="add" style="margin-top:8px"><input id="cn" placeholder="Ej: tren de la bruja, puesto de crepes…"><button class="btn" id="ca">Añadir</button></div>';
    D.custom.forEach(function(x,k){h+='<div class="it"><input type="checkbox" id="cx'+k+'" data-ck="'+esc(x.n)+'"'+(D.checks[x.n]?" checked":"")+'><label for="cx'+k+'">'+esc(x.n)+'</label><button class="x" data-cd="'+k+'">✕</button></div>'});
    h+='</details>';
  }
  $("v").innerHTML=h;
}

function resumen(){
  var L=["💍 *"+(D.name||"Nuestra boda")+"*"+(D.date?" · "+fdate(D.date):"")];
  var pers=0;D.guests.forEach(function(g){if(g.st!="no")pers+=1+(+g.plus||0)});
  if(D.guests.length){L.push("","👥 *Invitados* ("+pers+" personas)");
    D.guests.forEach(function(g){L.push("• "+g.n+(g.plus?" +"+g.plus:"")+" – "+(g.st=="si"?"viene":g.st=="no"?"no viene":"pendiente")+(g.note?" ("+g.note+")":""))})}
  var any=false;
  CAT.forEach(function(c){var m=c[1].split("|").filter(function(n){return D.checks[n]});
    if(m.length){if(!any){L.push("","✨ *Lo que me gustaría en mi boda*");any=true}L.push(c[0]+": "+m.join(", "))}});
  if(D.custom.length){if(!any)L.push("","✨ *Lo que me gustaría en mi boda*");L.push("✨ Otros: "+D.custom.map(function(x){return x.n}).join(", "))}
  return L.join("\n");
}
document.addEventListener("click",function(e){
  var t=e.target,d=t.dataset||{};
  if(t.id=="nb"){var nb=norm({});ALL.list.push(nb);ALL.cur=nb.id;pick();seed();save();tab="g";draw();$("nm").focus();return}
  if(d.t){tab=d.t;draw();return}
  if(t.id=="wa"){var url="https://wa.me/"+TEL+"?text="+encodeURIComponent(resumen());window.open(url,"_blank")||(location.href=url);return}
  if(t.id=="rs"){if(confirm("¿Empezar de nuevo? Se borrará todo lo que has marcado.")){ALL.list=ALL.list.filter(function(x){return x.id!=D.id});if(!ALL.list.length)ALL.list.push(norm({}));ALL.cur=ALL.list[0].id;pick();seed();save();draw()}return}
  if(t.id=="ga"){var n=$("gn").value.trim();if(n)chg(function(){D.guests.push({n:n,plus:+$("gp").value||0,st:"pe",note:""})});return}
  if(t.id=="ba"){var n2=$("bn").value.trim();if(n2)chg(function(){D.budget.push({n:n2,p:+$("bp").value||0,g:0,note:""})});return}
  if(t.id=="ta"){var n3=$("tn").value.trim();if(n3)chg(function(){D.tasks.push({id:uid(),n:n3,f:$("td").value,d:false})});return}
  if(t.id=="ca"){var n4=$("cn").value.trim();if(n4)chg(function(){D.custom.push({n:n4});svc(n4,true)});return}
  if(d.cd!=null&&confirm("¿Borrar?"))chg(function(){var x=D.custom.splice(+d.cd,1)[0];svc(x.n,false)});
  if(d.gd!=null&&confirm("¿Borrar invitado?"))chg(function(){D.guests.splice(+d.gd,1)});
  if(d.bd!=null&&confirm("¿Borrar gasto?"))chg(function(){D.budget.splice(+d.bd,1)});
  if(d.td!=null&&confirm("¿Borrar tarea?"))chg(function(){D.tasks=D.tasks.filter(function(x){return x.id!=d.td})});
});
document.addEventListener("change",function(e){
  var t=e.target,d=t.dataset||{};
  if(t.id=="sel"){ALL.cur=t.value;pick();save();draw();return}
  if(d.ck!=null){svc(d.ck,t.checked);save();draw();return}
  if(d.gs!=null)chg(function(){D.guests[+d.gs].st=t.value});
  if(d.gpl!=null)chg(function(){D.guests[+d.gpl].plus=+t.value||0});
  if(d.gno!=null){D.guests[+d.gno].note=t.value;save()}
  if(d.bp!=null)chg(function(){D.budget[+d.bp].p=+t.value||0});
  if(d.bg!=null)chg(function(){D.budget[+d.bg].g=+t.value||0});
  if(d.bno!=null){D.budget[+d.bno].note=t.value;save()}
  if(d.tc!=null)chg(function(){D.tasks.forEach(function(x){if(x.id==d.tc)x.d=t.checked})});
});
document.addEventListener("toggle",function(e){var o=e.target.dataset&&e.target.dataset.oc;if(o!=null)OP[o]=e.target.open},true);
$("nm").addEventListener("input",function(){D.name=this.value;save();$("ttl").textContent=D.name||"Nuestra Boda";var o=$("sel").selectedOptions[0];if(o)o.textContent=D.name||"Boda sin nombre"});
$("dt").addEventListener("change",function(){D.date=this.value;save();draw()});
loadLocal();if(seed())save();draw();
</script></body></html>
